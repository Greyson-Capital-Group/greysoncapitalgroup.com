<!DOCTYPE html>
<!-- Hidden copy of the contact form so Netlify Forms can detect its fields at deploy time. The real form is in components/Forms.tsx. -->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" method="POST">
  <input type="hidden" name="form-name" value="contact" />
  <input type="hidden" name="bot-field" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="company" />
  <input type="text" name="topic" />
  <textarea name="message"></textarea>
</form>
